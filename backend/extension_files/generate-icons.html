<!DOCTYPE html>
<!-- Run this file in your browser to auto-download all 3 PNG icons for the extension -->
<html>
<head><title>Generate Icons</title></head>
<body>
<script>
function drawIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0,   '#635bff');
  grad.addColorStop(0.5, '#9b59ff');
  grad.addColorStop(1,   '#e040fb');
  const r = size * 0.22;
  ctx.beginPath();
  ctx.moveTo(r, 0);
  ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size);
  ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fillStyle = grad;
  ctx.fill();

  // White document icon
  const p = size * 0.18;
  const w = size - p * 2;
  const h = w * 1.25;
  const top = (size - h) / 2;
  const fold = w * 0.3;
  ctx.beginPath();
  ctx.moveTo(p, top);
  ctx.lineTo(p + w - fold, top);
  ctx.lineTo(p + w, top + fold);
  ctx.lineTo(p + w, top + h);
  ctx.lineTo(p, top + h);
  ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.fill();

  // Fold corner
  ctx.beginPath();
  ctx.moveTo(p + w - fold, top);
  ctx.lineTo(p + w - fold, top + fold);
  ctx.lineTo(p + w, top + fold);
  ctx.closePath();
  ctx.fillStyle = 'rgba(99,91,255,0.4)';
  ctx.fill();

  // Text lines
  ctx.fillStyle = 'rgba(99,91,255,0.7)';
  const lh = h * 0.12;
  const lp = p + w * 0.12;
  const lw = w * 0.6;
  [0.42, 0.57, 0.72, 0.85].forEach(pct => {
    const y = top + h * pct;
    ctx.beginPath();
    ctx.roundRect(lp, y, lw * (pct < 0.8 ? 1 : 0.65), lh * 0.6, 2);
    ctx.fill();
  });

  return canvas;
}

[16, 48, 128].forEach(size => {
  const canvas = drawIcon(size);
  const a = document.createElement('a');
  a.download = `icon${size}.png`;
  a.href = canvas.toDataURL('image/png');
  a.click();
});

document.body.innerHTML = '<h2 style="font-family:sans-serif;padding:20px">✅ Icons downloaded! Place icon16.png, icon48.png, icon128.png inside the <code>extension/icons/</code> folder.</h2>';
</script>
</body>
</html>
